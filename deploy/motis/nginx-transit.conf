# OmniTransit — API orari (MOTIS su 127.0.0.1:8080). Solo /api/ è pubblico.
server {
    listen 80;
    listen [::]:80;
    server_name transit.ikonetsolutions.com;

    location /api/ {
        limit_req zone=motis_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        gzip on;
        gzip_types application/json;
    }

    location / {
        return 404;
    }
}
