# OmniTransit — API orari. /api/ = MOTIS (127.0.0.1:8080), /here/ = proxy HERE con chiave lato server.
server {
    server_name transit.ikonetsolutions.com;

    location /api/ {
        limit_req zone=motis_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        gzip on;
        gzip_types application/json;
    }

    # La chiave HERE (set $here_key "...";) sta solo qui, mai nell app né nel repository
    include /etc/nginx/secrets/here.conf;

    location ~ ^/here/(?<here_service>router|transit|discover|geocode|revgeocode)/(?<here_path>.*)$ {
        # Budget mensile superato -> 503 (file gestito da /opt/motis/here-budget.sh)
        include /etc/nginx/secrets/here-budget.conf;
        access_log /var/log/omnitransit/here-$here_month.log here_usage;
        limit_req zone=here_ip burst=10 nodelay;
        limit_req zone=here_total burst=30 nodelay;
        limit_req_status 429;
        if ($request_method !~ ^(GET|OPTIONS)$) { return 405; }
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers * always;
            return 204;
        }
        resolver 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
        proxy_pass https://$here_upstream/$here_path?$args&apiKey=$here_key;
        proxy_set_header Host $here_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name $here_upstream;
        # Cache solo se le intestazioni HERE lo permettono (termini 6.4): richieste uguali non si ripagano
        proxy_cache here_cache;
        proxy_cache_key "$here_service/$here_path?$args";
        proxy_cache_lock on;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        add_header X-Cache $upstream_cache_status always;
        proxy_read_timeout 20s;
        gzip on;
        gzip_types application/json;
    }

    location / {
        return 404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/transit.ikonetsolutions.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/transit.ikonetsolutions.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = transit.ikonetsolutions.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name transit.ikonetsolutions.com;
    return 404; # managed by Certbot


}