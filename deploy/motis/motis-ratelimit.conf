# OmniTransit / MOTIS: massimo 10 richieste al secondo per IP (con piccoli picchi)
limit_req_zone $binary_remote_addr zone=motis_api:10m rate=10r/s;

# OmniTransit / HERE (a consumo): per IP e tetto globale per non avere sorprese in bolletta.
# Alzare here_total quando il traffico cresce e il budget lo permette.
limit_req_zone $binary_remote_addr zone=here_ip:10m rate=2r/s;
limit_req_zone $server_name zone=here_total:1m rate=30r/m;
proxy_cache_path /var/cache/nginx/here levels=1:2 keys_zone=here_cache:20m max_size=500m inactive=1d use_temp_path=off;

map $here_service $here_upstream {
    router     transit.router.hereapi.com;
    transit    transit.hereapi.com;
    discover   discover.search.hereapi.com;
    geocode    geocode.search.hereapi.com;
    revgeocode revgeocode.search.hereapi.com;
}
